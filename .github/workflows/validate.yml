name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: >-
          python -m py_compile
          process-bilibili-course/scripts/bilibili_pipeline.py
          process-bilibili-course/scripts/course_utils.py
          process-bilibili-course/scripts/favorite_pipeline.py
          process-bilibili-course/scripts/knowledge_db.py
          process-bilibili-course/scripts/llm_client.py
          process-bilibili-course/scripts/web_app.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
